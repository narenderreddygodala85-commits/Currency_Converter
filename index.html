<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Currency Converter </title>
        <link href="style.css" rel="stylesheet" />

    </head>
    <body>
    <div class ="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>Enter Amount:</p>
                <input value="100" type="text"/>

            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From:</p>
                    <div class="select-container">
                        <select name="from">
                            <option value="USD">Usd</option>
                            <option value="INR">INR</option>
                            
                        </select>
                    </div>
                </div>
            <div class="to">
                <p>TO:</p>
                <div class="select-container">
                    <select name="to">
                        <option value="USD">Usd</option>
                        <option value="INR">INR</option>
                        
                    </select>
                </div>
            </div>

            </div>
            <div class="msg">1 USD=80INR</div>
            <button>Get Exchange Rate</button>

        </form>
    </div>
    <script src="app.js"></script>
    </body>
</html>
